name: Audit Remediation Probe

on:
  push:
    branches: [docs/agents-md-structure]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.ignore-scripts=true
      - name: Generate audit remediation candidate
        run: |
          set +e
          pnpm audit --fix
          audit_fix_exit=$?
          pnpm audit --audit-level high > audit-after.txt 2>&1
          audit_after_exit=$?
          set -e
          git diff -- package.json pnpm-workspace.yaml pnpm-lock.yaml > audit-fix.patch
          printf 'audit_fix_exit=%s\naudit_after_exit=%s\n' "$audit_fix_exit" "$audit_after_exit" > audit-status.txt
      - name: Upload remediation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-remediation-candidate
          path: |
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            audit-fix.patch
            audit-after.txt
            audit-status.txt
          if-no-files-found: error
          retention-days: 1
